plugins {
    id 'org.springframework.boot' version '3.0.13'
    id 'io.spring.dependency-management' version '1.1.4'
}

dependencies {
    compileOnly "org.projectlombok:lombok:1.18.42"
    annotationProcessor "org.projectlombok:lombok:1.18.42"

    implementation libs.springBootWeb
    implementation libs.springBootActuator
    implementation libs.springCloudEurekaClient
    implementation libs.springCloudConfigClient
    implementation "org.springframework.cloud:spring-cloud-starter-config"

    implementation libs.postgreSql
    implementation libs.springBootDataJpa
    implementation libs.keycloakAdminClient
    implementation libs.redisCache
    implementation libs.log4jApi
    implementation libs.log4jCore
    implementation libs.log4jSlf4jImpl
    implementation project(':GlobalExceptionHandlerLib')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${versions.springCloud}"
    }
}
