plugins {
    id 'java'
    id 'java-library'
}

ext {
    versions = [
            springBoot: '3.0.13',
            springCloud: '2022.0.4',
            log4j      : '2.20.0'
    ]

    libs = [
            springBootWeb: "org.springframework.boot:spring-boot-starter-web:${versions.springBoot}",
            springCloudEurekaServer      : "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server",
            springCloudAdminStarterServer: 'de.codecentric:spring-boot-admin-starter-server:3.2.2',
            springBootActuator            : "org.springframework.boot:spring-boot-starter-actuator:$versions.springBoot",
            springCloudConfigServer  : "org.springframework.cloud:spring-cloud-config-server",
            springCloudEurekaClient  : "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client",

            // Log4j
            log4jApi                     : "org.apache.logging.log4j:log4j-api:$versions.log4j",
            log4jCore                    : "org.apache.logging.log4j:log4j-core:$versions.log4j",
            log4jSlf4jImpl               : "org.apache.logging.log4j:log4j-slf4j-impl:$versions.log4j"
    ]
}

allprojects {
    group = 'com.buyukozkan'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}
